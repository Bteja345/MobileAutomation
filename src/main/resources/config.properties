# Automation Framework Configuration

# Appium Server Settings
appium.server.host=127.0.0.1
appium.server.port=4723
appium.server.timeout=30

# Web Browser Settings
web.browser.default=chrome
web.browser.headless=false
web.browser.maximize=true
web.page.timeout=30
web.element.timeout=10

# Mobile Device Settings
mobile.platform.default=android
mobile.device.timeout=10
mobile.app.timeout=30

# Android Settings
android.automation.name=UiAutomator2
android.device.name=Android Emulator
android.platform.version=11.0
android.app.package=com.facebook.katana
android.app.activity=com.facebook.katana.LoginActivity

# iOS Settings
ios.automation.name=XCUITest
ios.device.name=iPhone 14
ios.platform.version=16.0
ios.bundle.id=com.facebook.Facebook

# Test Data Settings
test.data.path=src/test/resources/testdata
test.screenshots.path=screenshots
test.recordings.path=recordings
test.logs.path=logs

# Retry Settings
test.retry.count=1
test.retry.failed.only=true

# Cleanup Settings
cleanup.screenshots.days=7
cleanup.recordings.days=7
cleanup.logs.days=30